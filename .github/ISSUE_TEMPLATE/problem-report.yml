name: Report a problem
description: Something in a notebook, dataset or the website doesn't work or looks wrong.
title: "[Tutorial ?] Problem: "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Everything here is public, so please don't include personal or health information.
  - type: dropdown
    id: tutorial
    attributes:
      label: Which tutorial?
      options:
        - Tutorial 1
        - Tutorial 2
        - Tutorial 3
        - Tutorial 4
        - Installation session
        - The website
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where is the problem?
      placeholder: "e.g. Part 2 notebook, section 3, the cell that runs ttest_ind"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Paste the error message if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: input
    id: system
    attributes:
      label: Your computer (optional)
      placeholder: "e.g. Windows 11, VS Code, Python (m3) environment"
