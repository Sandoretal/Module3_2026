# Builds the course website from the notebooks and publishes it to GitHub Pages.
#
# On every push to main it:
#   1. renders the student notebooks to HTML (outputs and answers stripped),
#      rebuilds the search index and the per-tutorial zips (no solutions),
#   2. checks every link, section anchor and GitHub file link on the site,
#   3. publishes docs/ to GitHub Pages, only if steps 1 and 2 passed.
# Pull requests run steps 1 and 2 only, so problems show up before merging.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook tools
        # mistune is pinned because nbconvert 7.10.0 breaks with mistune 3.1+
        # ("'MathBlockParser' object has no attribute 'parse_axt_heading'").
        run: pip install "nbconvert==7.10.0" "nbformat==5.9.2" "mistune==2.0.4"

      - name: Render notebooks, search index and downloads
        run: python tools/render_site_notebooks.py

      - name: Check links
        run: python tools/check_links.py

      - name: Check links to other websites (warnings only)
        run: python tools/check_links.py --external
        continue-on-error: true

      - name: Package the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
